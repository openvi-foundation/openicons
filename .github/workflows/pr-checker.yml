name: Pr Checker

on:
    pull_request:
        types: [opened, synchronize, reopened]
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 10.30.2
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install packages
              run: pnpm install --frozen-lockfile

            - name: SVG normalization
              run: pnpm run check

            - name: Codepoint stability
              env:
                  # The target branch on a PR, the previous tip of master on a push.
                  BASE_REF: ${{ github.base_ref || github.event.before }}
              run: |
                  git fetch --no-tags --depth=1 origin "$BASE_REF"
                  pnpm run check:codepoints FETCH_HEAD

            - name: Build
              run: pnpm run build

            # Also fails on an icon missing from scripts/categories.mjs.
            - name: Docs
              run: pnpm run docs:build

            - name: Generated files are committed
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      git status --short
                      echo "::error::Generated files are out of date. Run 'pnpm build' and commit the result."
                      exit 1
                  fi
